<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <div class="container-header">
            <div class="slogan">
                <img class="img-slogan" src="img/book-bookmark.svg" alt="bookmark">
                <p class="text-slogan">Capture your thoughts instantly</p>
            </div>
            <h1 class="title">My Tasks</h1>
            <p>Write a task and press 'Add' to save it to your list.</p>

            <form class="form" id="tareaForm">
                <input type="text" class="input-tarea" id="tarea" placeholder="Task">
                <button type="submit" class="btn-agregar" id="btnAgregar"> + Add</button>
                <button type="button" class="btn-sync" id="btnSync">Sync List</button>
            </form>
        </div>

    </header>

    <main class="main">
        <h3 class="title sub-title">List</h3>
        <ul class="tarea-list" id="listaTareas"></ul>
    </main>
    <script src="app.js"></script>
</body>

</html>
