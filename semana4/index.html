<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <div class="container-header">
            <div class="slogan">
                <img class="img-slogan" src="img/book-bookmark.svg" alt="bookmark">
                <p class="text-slogan">Captura tus pensamientos instataneamente</p>
            </div>
            <h1 class="title">Mis Tareas</h1>
            <p>Escribe una tarea y presiona 'Agregar' para guardarla en tu lista.</p>

            <form class="form" action="">
                <input type="text" class="input-tarea" id="tarea" placeholder="Tarea">
                <button class="btn-agregar" id="btnAgregar" type="submit"> + Agregar</button>
                <button class="btn-obtener" id="btnObtener">Obtener lista</button>
            </form>
        </div>

    </header>

    <main class="main">
        <h3 class="title sub-title">Lista</h3>
        <ul class="tarea-list" id="listaTareas"></ul>
    </main>
    <script src="app.js"></script>
</body>

</html>
