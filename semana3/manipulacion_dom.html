<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <div class="container-header">
            <div class="slogan">
                <img class="img-slogan" src="img/sparkle.svg" alt="star">
                <p class="text-slogan">Captura tus pensamientos instataneamente</p>
            </div>
            <h1 class="title">Mis Notas rapidas</h1>
            <p>Escribe una idea y presiona 'Agregar' para guardarla en tu lista.</p>

            <form class="form" action="">
                <input type="text" class="input-idea" id="idea" placeholder="Que tienes en mente hoy?">
                <button class="btn-agregar" id="btnAgregar" type="submit"> + Agregar</button>
            </form>
        </div>

    </header>

    <main class="main">
        <h3 class="title sub-title">Lista</h3>
        <ul class="idea-list" id="listaNotas">

        </ul>   
    </main>
    <script src="app.js"></script>
</body>

</html>
